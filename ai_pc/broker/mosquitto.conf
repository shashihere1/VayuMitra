# VayuMitra local MQTT broker — a single Mosquitto instance on the AI PC.
# The UNO Q and the phone connect to this over the venue Wi-Fi (LAN).
# No internet in the core loop = "runs on the edge".

# Listen on all interfaces so LAN devices (phone, UNO Q) can reach it.
listener 1883 0.0.0.0

# Hackathon/demo: anonymous access on a trusted local network.
# (For production, add password_file / TLS.)
allow_anonymous true

# Keep it stateless — no on-disk persistence of retained messages/sessions.
persistence false

# Log to stdout so `mosquitto -c mosquitto.conf -v` shows connections.
log_dest stdout
log_type all
connection_messages true
